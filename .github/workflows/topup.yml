name: Top-up

on:
  schedule:
    - cron: "23 3 * * 0"
  workflow_dispatch:
    inputs:
      force:
        description: "Top up even if stock is high"
        type: boolean
        default: false

permissions:
  contents: read

concurrency: topup

env:
  CONTENT_DIR: ${{ github.workspace }}/content

jobs:
  topup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CONTENT_REPO }}
          token: ${{ secrets.CONTENT_TOKEN }}
          path: content
      - name: Ask Gemini for new lines
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: python3 engine/run.py topup
      - if: always()
        name: Save to the content repo
        working-directory: content
        run: |
          git config user.name "hydra-bot"
          git config user.email "hydra-bot@users.noreply.github.com"
          git add -A heads/*/quotes.csv 2>/dev/null || true
          git diff --cached --quiet || (git commit -q -m "quote top-up [CI Skip]" && git pull -q --rebase && git push -q)
