name: Keep alive

# GitHub turns off scheduled workflows in a public repo after 60 days without commits.
# Daily activity lands in the private content repo, so once a month this makes a tiny commit here
# and re-enables the scheduled workflows in case GitHub has already switched any off.
on:
  schedule:
    - cron: "17 5 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in post.yml insights.yml topup.yml keepalive.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" >/dev/null && echo "$wf enabled" || echo "$wf: could not enable"
          done
      - name: Touch the repo
        run: |
          date -u +%Y-%m-%d > .github/last-keepalive
          git config user.name "hydra-bot"
          git config user.email "hydra-bot@users.noreply.github.com"
          git add .github/last-keepalive
          git diff --cached --quiet || (git commit -q -m "keepalive" && git push -q)
